<title>Deutsch A1–A2 · Ripasso</title>

<style>
:root{
  --bg:#f6f2ea; --card:#fffdf8; --ink:#1c1b19; --mute:#6f6a60; --line:#e3dccd;
  --red:#c8202f; --gold:#e3a614; --ok:#1f8a4c; --okbg:#e3f4ea; --no:#c8202f; --nobg:#fbe5e5;
  --der:#2d63c8; --die:#c8202f; --das:#1f8a4c; --shadow:0 1px 2px rgba(0,0,0,.05),0 6px 20px rgba(60,40,10,.06);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#151413; --card:#1f1e1c; --ink:#f2eee6; --mute:#a39d92; --line:#34312c;
  --okbg:#183326; --nobg:#3a1c1e; --shadow:0 1px 2px rgba(0,0,0,.3);
  --der:#5b8ef0; --das:#3fbf74; --die:#ef5361; --red:#ef5361; --ok:#3fbf74; --no:#ef5361;
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;font-size:16px;line-height:1.45}
.wrap{max-width:640px;margin:0 auto;padding:18px 16px 60px}
header{display:flex;align-items:center;gap:10px;margin-bottom:18px}
.flag{flex:none;width:6px;height:34px;border-radius:3px;background:linear-gradient(#1c1b19 0 33%,var(--red) 33% 66%,var(--gold) 66%)}
@media (prefers-color-scheme:dark){.flag{background:linear-gradient(#000 0 33%,var(--red) 33% 66%,var(--gold) 66%)}}
h1{font-family:Fraunces,Georgia,serif;font-weight:800;font-size:1.5rem;margin:0;letter-spacing:-.01em}
h1 small{display:block;font-family:Inter,system-ui,sans-serif;font-weight:500;font-size:.8rem;color:var(--mute);letter-spacing:0}
h3{font-size:.75rem;text-transform:uppercase;letter-spacing:.09em;color:var(--mute);margin:22px 0 8px;font-weight:600}
.back{flex:none;margin-left:auto;background:none;border:1px solid var(--line);color:var(--ink);border-radius:99px;padding:7px 14px;font:inherit;font-size:.9rem;cursor:pointer}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.stat b{display:block;font-family:Fraunces,Georgia,serif;font-size:1.35rem}
.stat span{font-size:.75rem;color:var(--mute)}
.stat b small{font-family:Inter,system-ui,sans-serif;font-size:.78rem;font-weight:500;color:var(--mute)}
.hint2{font-size:.85rem;color:var(--mute);margin:8px 0}
.exam{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:8px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;font-size:.88rem}
.exam input{font:inherit;font-size:.88rem;border:1px solid var(--line);border-radius:8px;padding:4px 6px;background:var(--bg);color:var(--ink)}
.exam b{font-family:Fraunces,Georgia,serif;font-size:1.05rem}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mode{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;text-align:left;cursor:pointer;font:inherit;color:inherit;box-shadow:var(--shadow);display:flex;gap:10px;align-items:center}
.mode:active{transform:scale(.98)}
.mode .ic{flex:none;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-weight:700;font-size:.8rem;color:#fff}
.mode b{display:block;font-size:.95rem;line-height:1.2}
.mode span{font-size:.76rem;color:var(--mute);line-height:1.25;display:block;margin-top:2px}
.mode.wide{grid-column:1/-1}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;margin:8px 0 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips.wrapc{flex-wrap:wrap;overflow:visible}
.chip{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:6px 12px;font:inherit;font-size:.85rem;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:6px 0 16px}
.bar i{display:block;height:100%;background:var(--gold);transition:width .3s}
.meta{display:flex;justify-content:space-between;font-size:.8rem;color:var(--mute)}
.q{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px 16px;box-shadow:var(--shadow)}
.q .tag{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--mute);font-weight:600}
.q .prompt{font-family:Fraunces,Georgia,serif;font-size:1.6rem;font-weight:600;margin:6px 0 4px;line-height:1.25;overflow-wrap:anywhere}
.q .prompt.sm{font-size:1.2rem}
.q .sub{color:var(--mute);font-size:.95rem}
.passage{background:var(--bg);border-radius:12px;padding:12px 14px;margin:8px 0 14px;font-size:.98rem;line-height:1.55}
.passage b{display:block;font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--mute);margin-bottom:4px}
.say{border:none;background:var(--bg);color:var(--ink);border-radius:99px;padding:6px 12px;font:inherit;font-size:.82rem;cursor:pointer;margin-top:8px}
.say.big{display:block;width:100%;padding:14px;font-size:1rem;font-weight:600;border:1.5px solid var(--line);border-radius:14px;margin:8px 0 12px}
.opts{display:grid;gap:8px;margin-top:16px}
.opt{border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;padding:13px 14px;font:inherit;font-size:1.02rem;text-align:left;cursor:pointer}
.opt:disabled{cursor:default}
.opt.ok{border-color:var(--ok);background:var(--okbg)}
.opt.no{border-color:var(--no);background:var(--nobg)}
.art{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:18px}
.art .opt{text-align:center;font-weight:700;font-size:1.15rem;color:#fff;border:none;padding:16px 0}
.art .der{background:var(--der)}.art .die{background:var(--die)}.art .das{background:var(--das)}
.art .opt.dim{opacity:.3}
.art .opt.ok,.art .opt.no{outline:3px solid var(--ink);outline-offset:2px}
input.ans,textarea.ans{width:100%;margin-top:16px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);border-radius:14px;padding:13px 14px;font:inherit;font-size:1.1rem}
textarea.ans{min-height:150px;font-size:1rem;resize:vertical}
.ans:focus{outline:none;border-color:var(--gold)}
input.ans.ok{border-color:var(--ok);background:var(--okbg)}
input.ans.no{border-color:var(--no);background:var(--nobg)}
.uml{display:flex;gap:6px;margin-top:8px}
.uml button{flex:1;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:8px 0;font:inherit;font-size:1rem;cursor:pointer}
.built{min-height:58px;border:1.5px dashed var(--line);border-radius:14px;padding:8px;margin-top:16px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.built.ok{border-style:solid;border-color:var(--ok);background:var(--okbg)}
.built.no{border-style:solid;border-color:var(--no);background:var(--nobg)}
.built .ph{color:var(--mute);font-size:.88rem;padding:0 6px}
.tokens{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.tok{border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:9px 12px;font:inherit;font-size:1rem;cursor:pointer}
.tok.used{opacity:.25}
.tok.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.fb{margin-top:14px;padding:12px 14px;border-radius:12px;font-size:.93rem;display:none}
.fb.show{display:block}
.fb.ok{background:var(--okbg)}.fb.no{background:var(--nobg)}
.fb b.h{display:block;margin-bottom:2px}
.actions{display:flex;gap:8px;margin-top:14px}
.btn{flex:1;border:none;border-radius:14px;padding:14px;font:inherit;font-weight:600;font-size:1rem;cursor:pointer;background:var(--ink);color:var(--bg)}
.btn.ghost{background:var(--card);color:var(--ink);border:1.5px solid var(--line)}
.btn.red{background:var(--red);color:#fff}
.btn.green{background:var(--ok);color:#fff}
.flash{perspective:1000px;margin-top:4px}
.flash .inner{position:relative;min-height:260px;transition:transform .45s;transform-style:preserve-3d;cursor:pointer}
.flash.flipped .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--card);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}
.face.back{transform:rotateY(180deg)}
.face .w{font-family:Fraunces,Georgia,serif;font-size:2rem;font-weight:600;line-height:1.2;overflow-wrap:anywhere}
.face .hint{position:absolute;bottom:14px;font-size:.75rem;color:var(--mute)}
.face .pl{color:var(--mute);margin-top:8px;font-size:.95rem}
.g-der{color:var(--der)}.g-die{color:var(--die)}.g-das{color:var(--das)}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px;margin:8px 0}
.seg button{flex:1;border:none;background:none;color:var(--ink);font:inherit;font-size:.85rem;padding:8px 4px;border-radius:9px;cursor:pointer}
.seg button.on{background:var(--ink);color:var(--bg)}
.summary{text-align:center}
.summary .big{font-family:Fraunces,Georgia,serif;font-size:3.2rem;font-weight:800}
.errs{text-align:left;margin-top:14px}
.errs div{padding:10px 4px;border-top:1px solid var(--line);font-size:.92rem}
.errs div span{color:var(--mute)}
.note{font-size:.82rem;color:var(--mute);margin-top:22px;text-align:center}
.empty{text-align:center;padding:40px 10px;color:var(--mute)}
.reset{background:none;border:none;color:var(--mute);text-decoration:underline;font:inherit;font-size:.8rem;cursor:pointer}
.model{display:none;margin-top:14px;background:var(--okbg);border-radius:12px;padding:12px 14px;font-size:.98rem;line-height:1.55}
.model.show{display:block}
ul.pts{margin:8px 0 0;padding-left:20px;font-size:.95rem}
details{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:8px;padding:0 14px}
summary{cursor:pointer;padding:13px 0;font-weight:600;list-style:none;display:flex;justify-content:space-between}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";color:var(--mute);font-weight:400}
details[open] summary::after{content:"–"}
details .in{padding-bottom:14px;font-size:.92rem}
details p{margin:6px 0}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.88rem;margin:6px 0}
th,td{border:1px solid var(--line);padding:5px 7px;text-align:left}
th{background:var(--bg);font-weight:600}
.wc{font-size:.8rem;color:var(--mute);margin-top:6px;text-align:right}
</style>
</head>

function streak(){var t=today(),n=0;if(!store.act[t])t--;while(store.act[t]){n++;t--;}return n;}
function weakTopic(){var best=null,k;for(k in store.gt){var g=store.gt[k];if(g.tot>=4){var p=g.ok/g.tot;if(p<.75&&(!best||p<best.p))best={t:k,p:p};}}return best;}

function delMiss(q){if(q.vid!=null)store.miss=store.miss.filter(function(x){return x!==q.vid;});if(q.gid!=null)store.gmiss=store.gmiss.filter(function(x){return x!==q.gid;});save();}

function norm(s){return String(s).toLowerCase().replace(/[.,!?…"'„“»«]/g,'').replace(/\s+/g,' ').trim();}
function deUml(s){return s.replace(/ä/g,'ae').replace(/ö/g,'oe').replace(/ü/g,'ue').replace(/ß/g,'ss');}
function check(inp,answers){var n=norm(inp);if(!n)return 'no';for(var i=0;i<answers.length;i++){var na=norm(answers[i]);if(n===na)return 'ok';if(deUml(n)===deUml(na))return 'uml';}return 'no';}

var ON=["null","eins","zwei","drei","vier","fünf","sechs","sieben","acht","neun","zehn","elf","zwölf","dreizehn","vierzehn","fünfzehn","sechzehn","siebzehn","achtzehn","neunzehn"];
var TE=["","","zwanzig","dreißig","vierzig","fünfzig","sechzig","siebzig","achtzig","neunzig"];
function n2d(n){
  if(n<20)return ON[n];
  if(n<100){var u=n%10,t=Math.floor(n/10);return (u?(u===1?"ein":ON[u])+"und":"")+TE[t];}
  if(n<1000){var h=Math.floor(n/100),r=n%100;return (h===1?"ein":ON[h])+"hundert"+(r?n2d(r):"");}
  var th=Math.floor(n/1000),r2=n%1000;return (th===1?"ein":ON[th])+"tausend"+(r2?n2d(r2):"");
}
function year2d(y){if(y>=1100&&y<2000){var r=y%100;return n2d(Math.floor(y/100))+"hundert"+(r?n2d(r):"");}return n2d(y);}

/* ================== GENERATORI ================== */
function pool(){return O.cat==="Tutte"?VOC:VOC.filter(function(v){return v.c===O.cat;});}
function vocMC(v,dir){
  var key=dir==="de"?"it":"de",seen={},d=[];seen[v[key]]=1;
  var cand=shuffle(VOC.filter(function(x){return x.c===v.c&&x.id!==v.id;})).concat(shuffle(VOC.filter(function(x){return x.c!==v.c;})));
  for(var i=0;i<cand.length&&d.length<3;i++){if(!seen[cand[i][key]]){seen[cand[i][key]]=1;d.push(cand[i][key]);}}
  return {kind:"mc",tag:v.c,prompt:dir==="de"?v.de:v.it,sub:dir==="de"?"Che cosa significa?":"Come si dice in tedesco?",opts:[v[key]].concat(d),speak:dir==="de"?v.de:null,speakAfter:v.de,vid:v.id,
    explain:esc(v.de)+' = '+esc(v.it)+(v.pl?' · pl. '+esc(v.pl):'')};
}
function vocWrite(v){return {kind:"input",tag:v.c,prompt:v.it,sub:v.g?"Nome: scrivi anche l'articolo":"In tedesco:",answers:[v.de],bare:v.g?v.bare:null,speakAfter:v.de,vid:v.id,explain:'<b>'+esc(v.de)+'</b>'+(v.pl?' · pl. '+esc(v.pl):'')};}
function vocArt(v){return {kind:"art",tag:v.c,prompt:v.bare,sub:v.it,answer:v.g,speakAfter:v.de,vid:v.id,explain:'<span class="g-'+v.g+'"><b>'+v.g+'</b></span> '+esc(v.bare)+(v.pl?' · pl. '+esc(v.pl):' · (di solito senza plurale)')};}
function verbQ(mode){
  mode=mode||O.vmode;
  if(mode==="mix"){var r=Math.random();mode=r<.45?"pr":r<.85?"pf":"pt";}
  var p=rnd(0,5),p0=PRON[p].split('/')[0],v,a;
  if(mode==="pt"){v=pick(PTV);a=PT[v.inf][p];
    return {kind:"input",tag:"Präteritum",prompt:PRON[p]+" ___",sub:v.inf+" — "+v.it,answers:[a],speakAfter:p0+" "+a,explain:v.inf+' (Präteritum): '+PT[v.inf].map(function(x,i){return PRON[i].split('/')[0]+' <b>'+x+'</b>';}).join(' · ')};}
  v=pick(VERBS);
  if(mode==="pf"){a=AUX[v.aux][p]+" "+v.part;var ans=[a];if(v.inf==="schwimmen")ans.push(AUX.h[p]+" "+v.part);
    return {kind:"input",tag:"Perfekt",prompt:PRON[p]+" ___",sub:v.inf+" — "+v.it,answers:ans,speakAfter:p0+" "+a,explain:PRON[p]+' <b>'+a+'</b> · ausiliare <b>'+(v.aux==="s"?"sein":"haben")+'</b>'};}
  a=v.pr[p];
  return {kind:"input",tag:"Präsens",prompt:PRON[p]+" ___",sub:v.inf+" — "+v.it,answers:[a],speakAfter:p0+" "+a,explain:v.inf+': '+v.pr.map(function(x,i){return PRON[i].split('/')[0]+' <b>'+x+'</b>';}).join(' · ')};
}
function gramQ(i){var g=GR[i];return {kind:"mc",tag:g[0],prompt:g[1],sub:"Scegli l'opzione giusta:",opts:g[2],explain:esc(g[3]),gid:i};}
function buildQ(s){
  var toks=s[1].split(' '),sh=shuffle(toks),n=0;
  while(sh.join(' ')===s[1]&&n++<10)sh=shuffle(toks);
  return {kind:"build",tag:"Ordine delle parole",prompt:s[0],sub:"Costruisci la frase in tedesco:",tok:sh,end:s[2],answers:[s[1]].concat(s[3]||[]),speakAfter:s[1]+s[2],explain:'<b>'+esc(s[1]+s[2])+'</b>'};
}
function numQ(){
  var listen=O.nmode==="listen"&&canSpeak;
  if(Math.random()<.35){
    var h=rnd(1,12),nh=h%12+1,ph=(h+10)%12+1,W=function(n){return ON[n];};
    var f=pick([[0,(h===1?"ein":W(h))+" Uhr"],[30,"halb "+W(nh)],[15,"Viertel nach "+W(h)],[45,"Viertel vor "+W(nh)],[10,"zehn nach "+W(h)],[50,"zehn vor "+W(nh)],[5,"fünf nach "+W(h)],[55,"fünf vor "+W(nh)],[20,"zwanzig nach "+W(h)],[40,"zwanzig vor "+W(nh)],[25,"fünf vor halb "+W(nh)],[35,"fünf nach halb "+W(nh)]]);
    var m=f[0],fmt=function(a,b){return a+":"+(b<10?"0":"")+b;};
    var o=[fmt(h,m),fmt(nh,m),fmt(ph,m),(m===0?fmt(nh,30):m===30?fmt(nh,0):fmt(h,60-m))];
    var txt="Es ist "+f[1]+".";
    return {kind:"mc",tag:"Orari",prompt:listen?"🔊 Che ore sono?":txt,sub:listen?"Ascolta e scegli":"Che ore sono?",opts:o,speak:txt,auto:listen,explain:esc(txt)+' = <b>'+o[0]+'</b>'};
  }
  var r=Math.random(),n,w,tag="Numeri";
  if(r<.4)n=rnd(11,99);else if(r<.7)n=rnd(100,999);else if(r<.85)n=rnd(1000,9999);else{n=rnd(1950,2026);tag="Anni";}
  w=tag==="Anni"?year2d(n):n2d(n);
  return {kind:"input",numeric:true,tag:tag,prompt:listen?"🔊 ?":w,sub:listen?"Ascolta e scrivi il numero in cifre":"Scrivi il numero in cifre",answers:[String(n)],speak:w,auto:listen,explain:'<b>'+n+'</b> = '+esc(w)};
}
function textQs(T,isH){
  var out=[];T.q.forEach(function(q,i){
    var rf=q[1].indexOf("Richtig")>=0&&q[1].indexOf("Falsch")>=0;
    var o={kind:"mc",tag:isH?"Hören":"Lesen · "+T.t,prompt:q[0],sub:rf?"Richtig oder falsch?":"",opts:q[1],fixed:rf?["Richtig","Falsch"]:null,sm:true};
    if(isH){if(canSpeak){o.audio=T.x;o.auto=i===0;}else o.passage=esc(T.x);o.explain='<i>Testo:</i> '+esc(T.x);}
    else{o.passage=T.x;o.explain=esc(q[2]||'');}
    out.push(o);});
  return out;
}
function makeRound(m){
  var out=[],i;
  if(m==="flash")return shuffle(pool()).slice(0,15);
  if(m==="quiz")return shuffle(pool()).slice(0,10).map(function(v){return vocMC(v,O.dir);});
  if(m==="write")return shuffle(pool()).slice(0,10).map(vocWrite);
  if(m==="art")return shuffle(pool().filter(function(v){return v.g;})).slice(0,10).map(vocArt);
  if(m==="verb"){for(i=0;i<10;i++)out.push(verbQ());return out;}
  if(m==="gram"){var idx=[];GR.forEach(function(g,j){if(O.gtop==="Tutti"||g[0]===O.gtop)idx.push(j);});return shuffle(idx).slice(0,10).map(gramQ);}
  if(m==="build")return shuffle(SENT).slice(0,8).map(buildQ);
  if(m==="num"){for(i=0;i<10;i++)out.push(numQ());return out;}
  if(m==="lesen"){shuffle(LESEN).slice(0,2).forEach(function(T){out=out.concat(textQs(T,false));});return out;}
  if(m==="hoeren"){shuffle(HOEREN).slice(0,4).forEach(function(T){out=out.concat(textQs(T,true));});return out;}
  if(m==="mix"){
    var gi=shuffle(GR.map(function(g,j){return j;})).slice(0,8).map(gramQ),vv=shuffle(VOC);
    out=gi.concat(vv.slice(0,3).map(function(v){return vocMC(v,Math.random()<.5?"de":"it");}),shuffle(VOC.filter(function(v){return v.g;})).slice(0,2).map(vocArt),vv.slice(3,5).map(vocWrite),[verbQ("pr"),verbQ("pf"),verbQ("pf")],shuffle(SENT).slice(0,2).map(buildQ));
    return shuffle(out);
  }
  if(m==="daily"){
    var t=today(),due=[],fresh=[];
    VOC.forEach(function(v){var s=store.srs[v.id];if(!s)fresh.push(v);else if(s.d<=t)due.push(v);});
    due.sort(function(a,b){return store.srs[a.id].d-store.srs[b.id].d;});due=due.slice(0,20);
    fresh=shuffle(fresh).slice(0,Math.min(8,Math.max(20-due.length,3)));
    var fid={};fresh.forEach(function(v){fid[v.id]=1;});
    return shuffle(due.concat(fresh)).map(function(v){var s=store.srs[v.id],b=s?s.b:0,q;
      if(b<=1)q=vocMC(v,"de");else if(b===2)q=(v.g&&Math.random()<.5)?vocArt(v):vocMC(v,"it");else q=vocWrite(v);
      if(fid[v.id])q.tag="Nuova · "+v.c;return q;});
  }
  if(m==="dikt")return shuffle(SENT).slice(0,8).map(function(s){var tx=s[1]+s[2];return {kind:"input",tag:"Dettato",prompt:"🔊 Ascolta e scrivi",sub:"Scrivi la frase che senti",speak:tx,auto:true,answers:[s[1]],explain:'<b>'+esc(tx)+'</b><br>'+esc(s[0])};});
  if(m==="exam"){
    var tag=function(a,sec){a.forEach(function(q){q.sec=sec;});return a;};
    shuffle(LESEN).slice(0,2).forEach(function(T){out=out.concat(tag(textQs(T,false),"Lesen"));});
    shuffle(HOEREN).slice(0,3).forEach(function(T){out=out.concat(tag(textQs(T,true),"Hören"));});
    out=out.concat(tag(shuffle(GR.map(function(g,j){return j;})).slice(0,8).map(gramQ).concat(shuffle(SENT).slice(0,2).map(buildQ)),"Grammatica e frasi"));
    return out;
  }
  if(m==="miss"){
    var items=store.miss.map(function(id){return ['v',id];}).concat(store.gmiss.map(function(id){return ['g',id];}));
    return shuffle(items).slice(0,10).map(function(it){
      if(it[0]==='g')return GR[it[1]]?gramQ(it[1]):null;
      var v=VOC[it[1]];if(!v)return null;var r=Math.random();
      return v.g&&r<.33?vocArt(v):r<.66?vocWrite(v):vocMC(v,Math.random()<.5?"de":"it");
    }).filter(Boolean);
  }
  return out;
}

/* ================== GIRO ================== */
var R=null;
function start(m){
  var qs=makeRound(m);
  if(!qs.length){app.innerHTML=bar(TITLE[m])+'<div class="empty">'+(m==="daily"?"Hai visto tutti i vocaboli e oggi non c'è niente da ripassare. Torna domani!":"Niente da mostrare qui.")+'</div>';bindBack();return;}
  R={m:m,qs:qs,i:0,ok:0,errs:[],sec:{}};
  if(m==="flash"){R.known=0;R.again=0;R.rep={};return flash();}
  render();
}
function render(){
  var q=R.qs[R.i],n=R.qs.length;
  var h=bar(TITLE[R.m])+'<div class="meta"><span>Domanda '+(R.i+1)+' di '+n+'</span><span>'+R.ok+' corrette</span></div><div class="bar"><i style="width:'+(R.i/n*100)+'%"></i></div><div class="q">';
  h+='<div class="tag">'+esc(q.tag)+'</div>';
  if(q.passage)h+='<div class="passage">'+q.passage+'</div>';
  if(q.audio)h+=sayBtn(q.audio,'Ascolta il testo','big');
  h+='<div class="prompt'+((q.sm||q.prompt.length>34)?' sm':'')+'">'+esc(q.prompt)+'</div>'+(q.sub?'<div class="sub">'+esc(q.sub)+'</div>':'')+(q.speak?sayBtn(q.speak):'');
  if(q.kind==="mc"){q._o=q.fixed||shuffle(q.opts);h+='<div class="opts">'+q._o.map(function(o,i){return '<button class="opt" data-i="'+i+'">'+esc(o)+'</button>';}).join('')+'</div>';}
  if(q.kind==="art"){h+='<div class="art">'+["der","die","das"].map(function(a){return '<button class="opt '+a+'" data-a="'+a+'">'+a+'</button>';}).join('')+'</div>';}
  if(q.kind==="input"){h+='<input class="ans" id="in" '+(q.numeric?'inputmode="numeric" ':'')+'autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Scrivi qui…">'+(q.numeric?'':'<div class="uml">'+["ä","ö","ü","ß"].map(function(c){return '<button type="button" data-c="'+c+'">'+c+'</button>';}).join('')+'</div>');}
  if(q.kind==="build"){h+='<div class="built" id="built"></div><div class="tokens" id="toks"></div>';}
  h+='<div class="fb" id="fb"></div></div><div class="actions" id="act">'+((q.kind==="input"||q.kind==="build")?'<button class="btn ghost" id="skip">Non lo so</button><button class="btn" id="chk">Controlla</button>':'')+'</div>';
  app.innerHTML=h;bindBack();window.scrollTo(0,0);
  if(q.auto)speak(q.audio||q.speak);
  var os=app.querySelectorAll('.opt');
  if(q.kind==="mc")Array.prototype.forEach.call(os,function(b){b.onclick=function(){
    var right=q._o[+b.getAttribute('data-i')]===q.opts[0];
    Array.prototype.forEach.call(os,function(x){x.disabled=true;if(q._o[+x.getAttribute('data-i')]===q.opts[0])x.classList.add('ok');});
    if(!right)b.classList.add('no');done(right,null);};});
  if(q.kind==="art")Array.prototype.forEach.call(os,function(b){b.onclick=function(){
    var right=b.getAttribute('data-a')===q.answer;
    Array.prototype.forEach.call(os,function(x){x.disabled=true;if(x.getAttribute('data-a')===q.answer)x.classList.add('ok');else if(x!==b)x.classList.add('dim');});
    if(!right)b.classList.add('no');done(right,null);};});
  if(q.kind==="input"){
    var inp=$('in');
    Array.prototype.forEach.call(app.querySelectorAll('[data-c]'),function(b){b.onclick=function(){if(inp.disabled)return;var s=inp.selectionStart==null?inp.value.length:inp.selectionStart,e2=inp.selectionEnd==null?s:inp.selectionEnd;inp.value=inp.value.slice(0,s)+b.getAttribute('data-c')+inp.value.slice(e2);inp.focus();try{inp.setSelectionRange(s+1,s+1);}catch(e){}};});
    var go=function(){if(inp.disabled)return;var r=check(inp.value,q.answers),msg=null,strip=function(x){return norm(x).replace(/^(der|die|das) /,'');};
      if(r==="no"&&q.bare){var lc=norm(inp.value);if(check(inp.value,[q.bare])!=="no")msg="Parola giusta, ma manca l'articolo!";else if(deUml(strip(inp.value))===deUml(strip(q.answers[0]))&&/^(der|die|das) /.test(lc))msg="Articolo sbagliato!";}
      if(r==="uml")msg="Giusto! (ricorda: ä, ö, ü, ß)";
      inp.disabled=true;inp.classList.add(r==="no"?"no":"ok");done(r!=="no",msg);};
    inp.addEventListener('keydown',function(e){if(e.key==="Enter"){e.preventDefault();go();}});
    $('chk').onclick=go;
    $('skip').onclick=function(){if(inp.disabled)return;inp.disabled=true;inp.classList.add('no');done(false,null);};
  }
  if(q.kind==="build"){
    var sel=[],locked=false,built=$('built'),toks=$('toks');

      built.innerHTML=sel.length?sel.map(function(ti,k){return '<button type="button" class="tok on" data-k="'+k+'">'+esc(q.tok[ti])+'</button>';}).join('')+'<span class="ph">'+esc(q.end)+'</span>':'<span class="ph">Tocca le parole qui sotto…</span>';
      toks.innerHTML=q.tok.map(function(w,ti){return '<button type="button" class="tok'+(sel.indexOf(ti)>=0?' used':'')+'" data-t="'+ti+'">'+esc(w)+'</button>';}).join('');
    };
    toks.onclick=function(e){var b=e.target.closest('[data-t]');if(!b||locked)return;var ti=+b.getAttribute('data-t');if(sel.indexOf(ti)<0){sel.push(ti);draw();}};
    built.onclick=function(e){var b=e.target.closest('[data-k]');if(!b||locked)return;sel.splice(+b.getAttribute('data-k'),1);draw();};
    draw();

      var right=!skip&&q.answers.some(function(a){return norm(a)===norm(s);});
      built.classList.add(right?'ok':'no');done(right,null);};
    $('chk').onclick=function(){if(sel.length)fin(false);};
    $('skip').onclick=function(){fin(true);};
  }
}
function done(right,msg){
  var q=R.qs[R.i];
  if(q.vid!=null)srsUp(q.vid,right);
  if(q.gid!=null){var gk=GR[q.gid][0],gs=store.gt[gk]||(store.gt[gk]={ok:0,tot:0});gs.tot++;if(right)gs.ok++;}
  if(q.sec){var sc=R.sec[q.sec]||(R.sec[q.sec]=[0,0]);sc[1]++;if(right)sc[0]++;}
  addStat(R.m,right);
  if(right){R.ok++;if(R.m==="miss")delMiss(q);}else{addMiss(q);R.errs.push(q);}
  var fb=$('fb');fb.className="fb show "+(right?"ok":"no");
  fb.innerHTML='<b class="h">'+(msg?esc(msg):right?pick(["Richtig! ✓","Super! ✓","Genau! ✓","Sehr gut! ✓"]):"Non proprio…")+'</b>'+(q.explain||'')+(q.speakAfter?'<br>'+sayBtn(q.speakAfter):'');
  if(q.speakAfter)speak(q.speakAfter);
  $('act').innerHTML='<button class="btn" id="nx">'+(R.i+1<R.qs.length?"Avanti →":"Vedi risultato")+'</button>';
  $('nx').onclick=next;
}
function next(){R.i++;if(R.i<R.qs.length)render();else summary();}
function summary(){
  try{if(canSpeak)window.speechSynthesis.cancel();}catch(e){}
  var n=R.qs.length,pct=Math.round(R.ok/n*100);
  var msg=(R.m==="mix"||R.m==="exam")?(pct>=60?"Bestanden! Promosso con il "+pct+"%":"Nicht bestanden: "+pct+"%. Serve il 60%."):(pct===100?"Perfekt! 🎉":pct>=80?"Sehr gut!":pct>=50?"Gut, weiter so!":"Übung macht den Meister.");
  var secH='',sk;for(sk in R.sec){secH+='<tr><td>'+esc(sk)+'</td><td>'+R.sec[sk][0]+' / '+R.sec[sk][1]+'</td><td>'+Math.round(R.sec[sk][0]/R.sec[sk][1]*100)+'%</td></tr>';}
  if(secH)secH='<div class="tw" style="margin-top:12px;text-align:left"><table><tr><th>Parte</th><th>Giuste</th><th>%</th></tr>'+secH+'</table></div>';
  app.innerHTML=bar("Risultato")+'<div class="q summary"><div class="big">'+R.ok+'/'+n+'</div><div style="font-family:Fraunces,Georgia,serif;font-size:1.15rem">'+msg+'</div>'+secH+
  (R.errs.length?'<div class="errs"><div class="tag">Da rivedere</div>'+R.errs.map(function(q){return '<div><b>'+esc(q.prompt)+'</b><br><span>'+(q.kind==="mc"&&q.vid==null?'→ '+esc(q.opts[0])+'. ':'')+(q.audio?'':(q.explain||''))+'</span></div>';}).join('')+'</div>':'')+'</div>'+
  '<div class="actions"><button class="btn ghost" id="hm">Menu</button><button class="btn" id="ag">Un altro giro</button></div>';
  bindBack();$('hm').onclick=home;var m=R.m;$('ag').onclick=function(){if(m==="miss"||m==="daily")setup(m);else start(m);};window.scrollTo(0,0);
}

/* ================== FLASHCARD ================== */
function flash(){
  if(R.i>=R.qs.length){
    app.innerHTML=bar("Flashcard")+'<div class="q summary"><div class="big">'+R.known+'</div><div style="font-family:Fraunces,Georgia,serif;font-size:1.15rem">carte sapute al primo colpo</div><p style="color:var(--mute)">'+(R.again?R.again+' ripetute: le trovi anche in «Ripassa i tuoi errori».':'Nessuna da ripetere. Toll!')+'</p></div><div class="actions"><button class="btn ghost" id="hm">Menu</button><button class="btn" id="ag">Nuovo mazzo</button></div>';
    bindBack();$('hm').onclick=home;$('ag').onclick=function(){start("flash");};return;}
  var v=R.qs[R.i],left=R.qs.length-R.i;
  var de='<div class="w">'+(v.g?'<span class="g-'+v.g+'">'+v.g+'</span> '+esc(v.bare):esc(v.de))+'</div>'+(v.pl?'<div class="pl">pl. '+esc(v.pl)+'</div>':'')+sayBtn(v.de);
  var it='<div class="w" style="font-size:1.6rem">'+esc(v.it)+'</div>';
  var front=O.dir==="de"?de:it,back=O.dir==="de"?it:de;
  app.innerHTML=bar("Flashcard")+'<div class="meta"><span>'+esc(v.c)+'</span><span>'+left+' nel mazzo</span></div><div class="bar"><i style="width:'+(R.i/R.qs.length*100)+'%"></i></div>'+
  '<div class="flash" id="fc"><div class="inner"><div class="face">'+front+'<div class="hint">tocca per girare</div></div><div class="face back">'+back+'</div></div></div><div class="actions" id="act"><button class="btn ghost" id="flip">Gira la carta</button></div>';
  bindBack();
  var fc=$('fc'),shown=false;
  var flip=function(){fc.classList.toggle('flipped');if(shown)return;shown=true;
    if(O.dir==="it")speak(v.de);
    $('act').innerHTML='<button class="btn red" id="no">Ripeti</button><button class="btn green" id="yes">Lo so</button>';
    $('no').onclick=function(){srsUp(v.id,false);addStat("flash",false);addMiss({vid:v.id});if(!R.rep[v.id]){R.again++;R.rep[v.id]=1;}R.qs.push(v);R.i++;flash();};
    $('yes').onclick=function(){srsUp(v.id,true);addStat("flash",true);if(!R.rep[v.id])R.known++;R.i++;flash();};};
  fc.onclick=flip;$('flip').onclick=flip;
}

/* ================== SCHREIBEN ================== */
function schreiben(i){
  var s=SCHR[i];
  app.innerHTML=bar("Schreiben")+'<div class="chips">'+SCHR.map(function(x,j){return '<button class="chip '+(j===i?'on':'')+'" data-j="'+j+'">'+(j+1)+' · '+x.k.split(' ')[0]+'</button>';}).join('')+'</div>'+
  '<div class="q"><div class="tag">'+esc(s.k)+' · '+esc(s.w)+'</div><div class="prompt sm">'+esc(s.t)+'</div><ul class="pts">'+s.p.map(function(p){return '<li>'+esc(p)+'</li>';}).join('')+'</ul>'+
  '<textarea class="ans" id="tx" placeholder="Schreib hier…" autocapitalize="sentences" spellcheck="false"></textarea><div class="wc" id="wc">0 parole</div>'+
  '<div class="model" id="md"><b>Modello</b><br>'+s.m+'<br>'+sayBtn(s.m.replace(/<br>/g,'. '))+'<p style="font-size:.85rem;margin:10px 0 0">Controlla: hai toccato tutti e tre i punti? Saluto e chiusura adatti (du / Sie)? Verbo in 2ª posizione, e in fondo dopo weil / dass?</p></div></div>'+
  '<div class="actions"><button class="btn ghost" id="sm">Mostra modello</button><button class="btn" id="nx">Traccia successiva</button></div>';
  bindBack();
  Array.prototype.forEach.call(app.querySelectorAll('[data-j]'),function(b){b.onclick=function(){schreiben(+b.getAttribute('data-j'));};});
  $('tx').oninput=function(){var w=this.value.trim().split(/\s+/).filter(Boolean).length;$('wc').textContent=w+(w===1?' parola':' parole');};
  $('sm').onclick=function(){$('md').classList.add('show');};
  $('nx').onclick=function(){schreiben((i+1)%SCHR.length);};
  window.scrollTo(0,0);
}

/* ================== SPRECHEN ================== */
function sprechen(p,i){
  var S=SPR[p],c=S.c[i];
  app.innerHTML=bar("Sprechen")+seg(SPR.map(function(x,j){return [String(j),"Teil "+(j+1)];}),String(p),"p")+
  '<p style="color:var(--mute);font-size:.9rem;margin:6px 0 12px">'+esc(S.d)+'</p><div class="meta"><span>'+esc(S.n)+'</span><span>'+(i+1)+' / '+S.c.length+'</span></div><div class="bar"><i style="width:'+((i+1)/S.c.length*100)+'%"></i></div>'+
  '<div class="q"><div class="prompt'+(c[0].length>26?' sm':'')+'">'+esc(c[0])+'</div>'+(c[1]?'<div class="sub">'+esc(c[1])+'</div>':'')+
  '<div class="model" id="md"><b>'+esc(c[2])+'</b>'+(c[3]?'<br>– '+esc(c[3]):'')+'<br>'+sayBtn(c[2]+(c[3]?' '+c[3]:''))+'</div></div>'+
  '<div class="actions"><button class="btn ghost" id="pv">←</button><button class="btn ghost" id="sm" style="flex:3">Mostra modello</button><button class="btn" id="nx">→</button></div>';
  bindBack();
  Array.prototype.forEach.call(app.querySelectorAll('[data-k="p"]'),function(b){b.onclick=function(){sprechen(+b.getAttribute('data-v'),0);};});
  $('sm').onclick=function(){$('md').classList.add('show');speak(c[2]+(c[3]?' '+c[3]:''));};
  $('nx').onclick=function(){sprechen(p,(i+1)%S.c.length);};
  $('pv').onclick=function(){sprechen(p,(i-1+S.c.length)%S.c.length);};
  window.scrollTo(0,0);
}

/* ================== SCHEDE ================== */
function schede(){
  app.innerHTML=bar("Schede")+SCHEDE.map(function(s){return '<details><summary>'+esc(s[0])+'</summary><div class="in">'+s[1]+'</div></details>';}).join('');
  bindBack();window.scrollTo(0,0);
}

/* ================== PROGRESSI ================== */
function prog(){
  var b=[VOC.length,0,0],k;for(k in store.srs){if(store.srs[k].b>=3)b[2]++;else b[1]++;b[0]--;}
  var rows=GTOP.map(function(t){var g=store.gt[t];return [t,g?g.ok:0,g?g.tot:0];}).sort(function(a,c){return (a[2]?a[1]/a[2]:2)-(c[2]?c[1]/c[2]:2);});
  var code="";try{code=JSON.stringify(store);}catch(e){}
  var h=bar("Progressi")+'<h3 style="margin-top:0">Vocaboli</h3><div class="stats"><div class="stat"><b>'+b[0]+'</b><span>mai viste</span></div><div class="stat"><b>'+b[1]+'</b><span>in corso</span></div><div class="stat"><b>'+b[2]+'</b><span>imparate</span></div></div>'+
  '<p class="hint2">Ogni risposta giusta allontana il prossimo ripasso (1, 2, 4, 8, 16 giorni); un errore lo riporta a domani. Una parola conta come imparata dopo alcune risposte giuste di fila.</p>'+
  '<h3>Grammatica per argomento</h3><div class="tw"><table><tr><th>Argomento</th><th>Giuste</th><th>%</th></tr>'+rows.map(function(r){return '<tr><td>'+esc(r[0])+'</td><td>'+(r[2]?r[1]+' / '+r[2]:'–')+'</td><td>'+(r[2]?Math.round(r[1]/r[2]*100)+'%':'–')+'</td></tr>';}).join('')+'</table></div>'+
  '<h3>Per modalità</h3><div class="tw"><table><tr><th>Modalità</th><th>Giuste</th><th>%</th></tr>';
  for(k in store.stats){var s=store.stats[k];h+='<tr><td>'+esc(TITLE[k]||k)+'</td><td>'+s.ok+' / '+s.tot+'</td><td>'+(s.tot?Math.round(s.ok/s.tot*100):0)+'%</td></tr>';}
  h+='</table></div><h3>Backup</h3><p class="hint2">I progressi restano solo su questo dispositivo. Per non perderli, o per portarli su un altro, copia questo codice e incollalo là nel riquadro «Importa».</p>'+
  '<textarea class="ans" id="ex" readonly style="min-height:70px;font-size:.72rem;margin-top:0">'+esc(code)+'</textarea><div class="actions"><button class="btn ghost" id="cp">Copia il codice</button></div>'+
  '<textarea class="ans" id="im" style="min-height:70px;font-size:.72rem" placeholder="Importa: incolla qui un codice…"></textarea><div class="hint2" id="imsg"></div><div class="actions"><button class="btn ghost" id="ib">Importa</button><button class="btn ghost" id="rst">Azzera tutto</button></div>';
  app.innerHTML=h;bindBack();window.scrollTo(0,0);
  $('cp').onclick=function(){var bt=this,ok=function(){bt.textContent="Copiato ✓";},sel=function(){try{$('ex').focus();$('ex').select();}catch(e){}bt.textContent="Selezionato: ora copia";};
    try{navigator.clipboard.writeText(code).then(ok,sel);}catch(e){sel();}};
  $('ib').onclick=function(){try{var o=JSON.parse($('im').value);if(!o||typeof o!=="object"||typeof o.stats!=="object")throw 0;
    store={stats:o.stats||{},miss:o.miss||[],gmiss:o.gmiss||[],exam:o.exam||"",srs:o.srs||{},act:o.act||{},gt:o.gt||{}};save();home();}catch(e){$('imsg').textContent="Codice non valido.";}};
  var armed=false;$('rst').onclick=function(){if(!armed){armed=true;this.textContent="Tocca ancora per confermare";return;}store={stats:{},miss:[],gmiss:[],exam:store.exam,srs:{},act:{},gt:{}};save();home();};
}

try{home();}catch(err){app.innerHTML='<p>Errore di avvio: '+esc(err&&err.message)+'</p>';}
})();
</script>
</body>
</html>
